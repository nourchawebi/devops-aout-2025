name: build and push docker image to dockerhub
on:
  push:
    branches:
      - seance4
jobs:
  push_to_dockerhub:
    name: build and push docker image
    runs-on: ubuntu-latest
    steps:
      - name: checkout this repo
        uses: actions/checkout@v5
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: nourchawebi/astonvillaaout2025:1.1.${{github.run_number }}
      - name: checkout argotests repo
        uses: actions/checkout@v4
        with:
          repository: nourchawebi/argotests
          token: ${{secrets.GHCR_TOKEN}}
          path: argotests
          ref: main
      - name: Update image tag in astonvilla-deployment.yml
        run: |
          sed -i 's|image: nourchawebi/astonvillaaout2025:.*|image: nourchawebi/astonvillaaout2025:1.1.${{github.run_number }}|' argotests/astonvilla-app/astonvilla-deployment.yml
      - name: Commit and push changes to argotests
        run: |
          cd argotests
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add astonvilla-app/astonvilla-deployment.yml
          git commit -m "Update adtonvilla image to "1.1.${{github.run_number }}"
          git push